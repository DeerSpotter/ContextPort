name: Apply Temporary Chat Feature

on:
  push:
    branches:
      - agent/default-temporary-chat
    paths:
      - .github/temporary-chat.patch
      - .github/workflows/apply-temporary-chat-feature.yml

permissions:
  contents: write

concurrency:
  group: apply-temporary-chat-feature
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/default-temporary-chat
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/temporary-chat.patch
          git apply .github/temporary-chat.patch

      - name: Validate Swift and version
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse ChatGPTWebView/App/RootView.swift
          grep -q 'MARKETING_VERSION: "2.10.19"' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: "99"' project.yml

      - name: Commit applied feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ChatGPTWebView/App/RootView.swift project.yml
          git commit -m "Add temporary chat default setting"
          git push origin HEAD:agent/default-temporary-chat
